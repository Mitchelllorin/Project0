# Serves the studio bundle and proxies /api to the API container, so the browser
# only ever talks to one origin: no CORS, no baked-in backend hostname.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A configurator is embedded in clients' own pages; these are the basics their
    # security review asks about.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Create-React-App fingerprints everything in /static, so it can be cached hard.
    location /static/ {
        expires 1y;
    }

    # The shell must always be revalidated, or a client's browser keeps serving the
    # bundle from before the update.
    location = /index.html {
        expires -1;
    }

    location /api/ {
        proxy_pass http://api:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Single-page app: every other path serves the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
